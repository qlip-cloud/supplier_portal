{% extends "qp_supplier_front/templates/includes/container.html" %}

{% block content_page %}
<div class="row">


    <div class="col-lg-12" id="area">


        <div class="row row-line">

            <div class="col-lg-2">
                <input type="text" autocomplete="off"
                    class="input-with-feedback form-control floating-input bold filter-list" maxlength="140"
                    data-fieldtype="Data" data-doctype="Issue" id="qp_order_id" placeholder="Orden">
            </div>


            <div class="col-lg-2">
                <input type="date" autocomplete="off" class="input-with-feedback form-control bold filter-list date"
                    id="start_date" data-placeholder="Fecha de radicación" data-date_key = "{{date_key}}">
            </div>
            <div class="col-lg-2">
                <input type="date" autocomplete="off" class="input-with-feedback form-control bold filter-list date"
                    id="end_date" data-placeholder="Fecha de radicación" data-date_key = "{{date_key}}">
            </div>
            <div class="col-lg-1 offset-lg-5">
                <div class="row">
                    <div class="col-sm-6 offset-lg-6">
                        <span class="material-symbols-outlined btn  btn-primary" id="refresh_filter_list">
                            refresh
                        </span>
                    </div>
                    
                </div>
            </div>


        </div>
        <div class="row row-line">
            <table class="table table-striped table-bordered table-list">
                <thead>
                    <th>Orden</th>
                    <!--th>Estado</th-->
                    <th>Fecha de creación</th>
                    <th>Detalle</th>

                </thead>
                <tbody id="accordion" data-key="{{key}}" data-doctype="{{doctype}}"
                    data-doctype_detail="{{doctype_detail}}" data-order_by="{{order_by}}" >

                    {% include "qp_supplier_front/templates/list/sales_order/list.html" %}

                </tbody>
            </table>

        </div>
        <div class="row row-line">
            <div class="col-sm-12" style="display: none;" id="loading">
                Buscando información...
            </div>
            <div class="col-sm-12" style="display: none;" id="no-more">
                No hay más registros.
            </div>
        </div>

    </div>


</div>
{% endblock %}
