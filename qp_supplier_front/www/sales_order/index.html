{% extends "qp_supplier_front/templates/includes/container.html" %}

{% block content_page %}
    <div class="row">

     
        <div class="col-lg-12" id="area">


            <div class="row row-line">

                <div class="col-lg-3">
                    <input type="text" autocomplete="off" class="input-with-feedback form-control floating-input bold"
                        maxlength="140" data-fieldtype="Data" data-doctype="Issue" id="Nombre" placeholder="Orden">
                </div>


                <div class="col-lg-3">
                    <input type="date" autocomplete="off" class="input-with-feedback form-control bold" id="filing_date"
                        data-placeholder="Fecha de radicación">
                </div>

                <div class="col-lg-3">

                    <select class="form-control" name="status" id="status" data-label="Status" data-fieldtype="Select">
                        <option value="0" selected="selected" class="custom-option">Estado</option>
                    </select>
                </div>

            </div>
            <div class="row row-line">
                <table class="table table-striped table-bordered table-list">
                    <thead>
                        <th>Orden</th>
                        <th>Estado</th>
                        <th>Fecha de creación</th>
                        <th></th>

                    </thead>
                    <tbody>
                        <tr>
                            <td>OC-6365145</td>
                            <td>Por entregar</td>
                            <td>23- 08-2022</td>
                            <td></td>
                        </tr>
                       
                    </tbody>
                </table>

            </div>

        </div>


    </div>
{% endblock %}
