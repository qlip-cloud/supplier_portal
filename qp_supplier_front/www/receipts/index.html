{% extends "qp_supplier_front/templates/includes/container.html" %}

{% block content_page %}


<div class="row">


    <div class="col-lg-12" id="area">


        <div class="row row-line">

            <div class="col-lg-3">
                <input type="text" autocomplete="off" class="input-with-feedback form-control floating-input bold filter-list"
                    maxlength="140" data-fieldtype="Data" data-doctype="Issue" id="qp_receipt_id" placeholder="Orden">
            </div>

            <div class="col-lg-3">
                <input type="date" autocomplete="off" class="input-with-feedback form-control bold filter-list date" id="qp_create_date"
                    data-placeholder="Fecha de radicación">
            </div>

        </div>
        <div class="row row-line">
            <table class="table table-striped table-bordered table-list">
                <thead>
                    <th>Recibo</th>
                    <th>Fecha de Pago</th>
                    <th>Monto</th>
                    <th>Detalle</th>

                </thead>
                <tbody id="accordion" data-key="{{key}}" data-doctype="{{doctype}}" data-doctype_detail="{{doctype_detail}}">
                    {% include "qp_supplier_front/templates/list/receipts/list.html" %}
                    
                </tbody>
            </table>

        </div>

    </div>


</div>
{% endblock %}
