<div class="modal fade" id="assign_invoice_modal" tabindex="-1" aria-labelledby="assign_invoice_modal_label" aria-hidden="true">
    <style>
        #assign_invoice_modal .modal-header {
            display: block;
            text-align: center;
            position: relative;
        }
        #assign_invoice_modal .modal-header .close {
            position: absolute;
            right: 1rem;
            top: 1rem;
        }
        #assign_invoice_modal .modal-title {
            color: #004D90;
        }
        #assign_invoice_modal .subtitle {
            text-align: center;
        }
        #assign_invoice_modal .table-no-border thead th {
            color: #004D90;
            text-align: center;
        }
        #assign_invoice_modal .table-no-border {
            border: none;
        }
        #assign_invoice_modal .table-no-border th,
        #assign_invoice_modal .table-no-border td {
            border: none;
            border-bottom: 1px solid #dee2e6;
        }
        #assign_invoice_modal .table-no-border tr:last-child td {
            border-bottom: none;
        }
        #assign_invoice_modal #assign-user-list {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 6px 10px;
        }
        #assign_invoice_modal .assign-user-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            margin: 0;
            padding: 4px 0;
            cursor: pointer;
        }
        #assign_invoice_modal .assign-user-option input {
            margin: 0;
        }
        #assign_invoice_modal .assign-user-empty {
            color: #8a9099;
            font-size: 12px;
            padding: 6px 0;
        }
    </style>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="assign_invoice_modal_label">Asignar Facturas</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p class="subtitle">Est&aacute; seguro de que desea asignar los siguientes documentos?</p>
                <div style="max-height:250px;overflow-y:auto;margin-bottom:16px">
                    <table class="table table-striped table-no-border" style="margin-bottom:0">
                        <thead>
                            <tr>
                                <th>Factura Proveedor</th>
                                <th>Orden de compra</th>
                                <th>Recepcion</th>
                            </tr>
                        </thead>
                        <tbody id="assign-table-body"></tbody>
                    </table>
                </div>
                <hr>
                <div class="form-group">
                    <input type="text" class="form-control" id="assign-user-search"
                        placeholder="Buscar usuario..." autocomplete="off">
                </div>
                <div id="assign-user-list">
                    <div class="assign-user-empty">Cargando usuarios...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default btn-sm btn-modal-close" data-dismiss="modal">
                    <span class="hidden-xs">Cancelar</span>
                </button>
                <button type="button" class="btn btn-primary btn-sm" id="confirm-assign">Asignar</button>
            </div>
        </div>
    </div>
</div>
