<div class="modal fade" id="reject_invoice_motive" tabindex="-1" aria-labelledby="reject_invoice_motive_label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reject_invoice_motive_label">Rechazar factura(s)</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row row-line">
                    <div class="col-lg-12">
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="is_invoice_error">
                                Es un error de factura?
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row row-line">
                    <div class="col-lg-12">
                        <div class="form-group">
                            <label for="motive_text">Indique el motivo *</label>
                            <textarea class="form-control" id="motive_text" rows="3"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default btn-sm btn-modal-close" data-dismiss="modal">
                    <span class="hidden-xs">Cerrar</span>
                </button>
                {% if is_documenteme_admin %}
                    <button type="button" class="btn btn-sm btn-danger" disabled id="confirm-reject">Rechazar</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
