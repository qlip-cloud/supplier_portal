<div class="modal fade" id="contact_modal" tabindex="-1" aria-labelledby="contact_modal_label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contact_modal_label">Agregar contacto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="form-estandar form-modal" method="POST" id="form-contact"
                    action="api/method/qp_supplier_front.resources.information.contact.save">
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <input type="text" autocomplete="off"
                                class="input-with-feedback form-control floating-input bold" maxlength="140"
                                data-fieldtype="Data" data-doctype="Issue" name="first_name" id="first_name"
                                placeholder="Nombre de contacto" value="">
                        </div>
                    </div>
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <input type="text" autocomplete="off"
                                class="input-with-feedback form-control floating-input bold" maxlength="140"
                                data-fieldtype="Data" data-doctype="Issue" name="email_id" id="email_id"
                                placeholder="Correo electronico" value="">
                        </div>
                    </div>
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <input type="text" autocomplete="off"
                                class="input-with-feedback form-control floating-input bold" maxlength="140"
                                data-fieldtype="Data" data-doctype="Issue" name="phone" id="phone"
                                placeholder="Teléfono" value="">
                        </div>
                    </div>


                    <div class="row row-line">
                        <div class="col-lg-12">
                            <button class="btn btn-primary btn-sm primary-action" id="save">Guardar</button>
                        </div>
                    </div>
                    <input type="hidden" name="doctype_id" value="">

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
