<div class="modal fade" id="invoice_detail_modal" tabindex="-1" aria-labelledby="invoice_detail_modal_label" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="invoice_detail_modal_label">Detalle de la factura</h5>
                    <div class="invoice-detail-subtitle" id="invoice-detail-subtitle"></div>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="invoice-detail-toolbar">
                <div class="invoice-detail-tabs">
                    <button type="button" class="invoice-detail-tab active" data-tab="orders">Órdenes de compra</button>
                    <button type="button" class="invoice-detail-tab" data-tab="receipts">Recepciones</button>
                </div>
                <input type="text" class="form-control form-control-sm" id="invoice-detail-search"
                    placeholder="Buscar por OC o recibo..." autocomplete="off">
            </div>
            <div class="modal-body" id="invoice-detail-body">
                <div style="color:#8a9099;font-size:13px;text-align:center;padding:24px">Cargando...</div>
            </div>
        </div>
    </div>
</div>
