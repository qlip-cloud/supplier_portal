<style>
    .timeline-entry { position: relative; padding: 0 0 16px 34px; }
    .timeline-entry::before {
        content: '';
        position: absolute;
        left: 12px; top: 22px; bottom: -2px;
        width: 2px; background: #d0d4d8;
    }
    .timeline-entry:last-child::before { display: none; }
    .timeline-dot {
        position: absolute; left: 0; top: 0;
        width: 26px; height: 26px; border-radius: 50%;
        background: #fff; border: 2px solid #004D90;
        display: inline-flex; align-items: center; justify-content: center;
    }
    .timeline-dot .material-symbols-outlined { font-size: 14px; }
</style>
<div class="modal fade" id="timeline_invoice_modal" tabindex="-1" aria-labelledby="timeline_invoice_modal_label" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="timeline_invoice_modal_label">Observaciones</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row row-line">
                    <div class="col-lg-12">
                        <div id="timeline_unread_hint" style="color:#004D90;font-size:12px;margin-bottom:4px"></div>
                        <div class="form-group">
                            <label for="timeline_comment_text">Agregar comentario</label>
                            <textarea class="form-control" id="timeline_comment_text" rows="3" maxlength="2000"></textarea>
                            <div id="timeline_send_to_bc_wrapper" style="display:none;margin-top:6px">
                                <label style="font-size:12px;color:#004D90;margin:0;cursor:pointer">
                                    <input type="checkbox" id="timeline_send_to_bc" style="vertical-align:middle;margin-right:4px">
                                    Enviar a BC
                                </label>
                                <span style="color:#8a9099;font-size:11px;margin-left:6px">El comentario se incluir&aacute; en la factura que se crea en BC.</span>
                            </div>
                            <div id="timeline_attachment_wrapper" style="display:none;margin-top:6px">
                                <a href="#" id="timeline_attach_trigger" style="font-size:12px;color:#004D90;text-decoration:none">
                                    <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">attach_file</span>
                                    Adjuntar archivo
                                </a>
                                <span id="timeline_new_attachment_name" style="font-size:12px;color:#444;margin-left:8px"></span>
                                <a href="#" id="timeline_new_attachment_remove" style="display:none;font-size:12px;color:#dc3545;margin-left:8px">quitar</a>
                                <input type="file" id="timeline_new_attachment_input" style="display:none">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row row-line">
                    <div class="col-lg-12">
                        <h5 style="color:#004D90;font-size:14px;font-weight:bold;margin:0 0 4px 0">Comentarios</h5>
                        <div id="timeline-list" style="height:340px;overflow-y:auto;padding:8px 4px;"></div>
                    </div>
                </div>
                <input type="file" id="timeline_change_attachment_input" style="display:none">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default btn-sm btn-modal-close" data-dismiss="modal">
                    <span class="hidden-xs">Cerrar</span>
                </button>
                <button type="button" class="btn btn-primary btn-sm" id="confirm-timeline-comment" disabled>
                    <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">send</span>
                    Agregar comentario
                </button>
            </div>
        </div>
    </div>
</div>
