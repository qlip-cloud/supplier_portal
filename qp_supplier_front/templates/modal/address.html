<div class="modal fade" id="addres_modal" tabindex="-1" aria-labelledby="addres_modal_label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addres_modal_label">Agregar direccion</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form class="form-estandar form-modal" method="POST" data-method-default = "POST" id="form-address" action="api/method/qp_supplier_front.resources.information.address.save">
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <select class="form-control" name="country" id="country" data-label="País"
                                data-fieldtype="Select">
                                <option value="0" selected="selected" class="custom-option">País
                                </option>
                                {% for country in countries %}
                                <option value="{{country.name}}" class="custom-option">
                                    {{country.country_name}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <select class="form-control" name="city" id="city" data-label="Departamento"
                                data-fieldtype="Select">
                                <option value="0" selected="selected" class="custom-option">Departamento
                                </option>
                                {% for city in cities %}
                                <option value="{{city.name}}" class="custom-option">
                                    {{city.state_name}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row row-line">

                        <div class="col-lg-12">
                            <select class="form-control" name="state" id="state" data-label="Municipio"
                                data-fieldtype="Select">
                                <option value="0" selected="selected" class="custom-option">Municipio
                                </option>
                                {% for state in states %}
                                <option value="{{state.name}}" class="custom-option">
                                    {{state.municipality_name}}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row row-line">
                        <div class="col-lg-12">
                            <textarea name="address_line1" id="address_line1"></textarea>
                        </div>
                    </div>
                    <div class="row row-line">
                        <div class="col-lg-4">
                            <button class="btn btn-primary btn-sm primary-action {{ '' if is_estatus_editable else 'hidden disabled' }} button-save" id="save">Guardar</button>
                        </div>
                    </div>
                    <input type="hidden" name="doctype_id" value="">

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
