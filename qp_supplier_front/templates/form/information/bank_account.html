<form class = "form-estandar" id="form-bank-account" action="api/method/qp_supplier_front.resources.information.bank_account.save_complement">
    <div class="row row-line">
        <div class="col-lg-4">
            <label for="qp_public_resource_management">¿Por su cargo o actividad maneja o maneja recursos públicos? (Sí/No)</label>
            <select class="form-control" name="qp_public_resource_management" id="qp_public_resource_management" data-label="qp_public_resource_management"
                data-fieldtype="Select">
                <option value="" selected="selected" class="custom-option">Respuesta</option>
                <option value="SI" class="custom-option"> SI </option>
                <option value="NO" class="custom-option"> NO </option>
            </select>
        </div>
        <div class="col-lg-4">
            <label for="qp_public_activity">¿Por su cargo o actividad es o ejerce alguna figura de poder público? (Sí/No)</label>
            <select class="form-control" name="qp_public_activity" id="qp_public_activity" data-label="qp_public_activity"
                data-fieldtype="Select">
                <option value="" selected="selected" class="custom-option">Respuesta</option>
                <option value="SI" class="custom-option"> SI </option>
                <option value="NO" class="custom-option"> NO </option>
            </select>
        </div>
        <div class="col-lg-4">
            <label for="qp_public_recognition">¿Por su actividad o oficio goza de reconocimiento público nacional o internacional?
                (Sí/No)</label>
            <select class="form-control" name="qp_public_recognition" id="qp_public_recognition" data-label="qp_public_recognition"
                data-fieldtype="Select">
                <option value="" selected="selected" class="custom-option">Respuesta</option>
                <option value="SI" class="custom-option"> SI </option>
                <option value="NO" class="custom-option"> NO </option>
            </select>
        </div>
    </div>
    <div class="row row-line">
        <div class="col-lg-4">
            <label for="qp_link_politically_exposed">¿Existe algún vínculo entre usted y una persona considerada políticamente expuesta?
                (Sí/No)</label>
            <select class="form-control" name="qp_link_politically_exposed" id="qp_link_politically_exposed" data-label="qp_link_politically_exposed"
                data-fieldtype="Select">
                <option value="" selected="selected" class="custom-option">Respuesta</option>
                <option value="SI" class="custom-option"> SI </option>
                <option value="NO" class="custom-option"> NO </option>
            </select>
        </div>
        <div class="col-lg-8">
            <label for="qp_detail_politically_exposed">En caso de ser afirmativo, detalle entidades estatales con vínculo contractual</label>

            <input type="text" autocomplete="off" name="qp_detail_politically_exposed"
                class="input-with-feedback form-control floating-input bold" maxlength="140" data-fieldtype="Data"
                data-doctype="Issue" id="qp_detail_politically_exposed" value="{{supplier.qp_detail_politically_exposed or ''}}" placeholder="Respuesta">
        </div>
    </div>
    <div class="row row-line">
        <div class="col-sm-4">
            <button class="btn btn-primary btn-sm primary-action {{ '' if is_estatus_editable else 'hidden disabled' }}" id="save">Guardar</button>
        </div>
    </div>
</form>
<div class="row row-line">


    <div class="col-sm-4">
        <button type="button" class="btn btn-primary btn-sm primary-action {{ '' if is_estatus_editable else 'hidden disabled' }}" data-toggle="modal"
            data-target="#bank_account_modal">+New</button>
    </div>

</div>

<div class="row row-line">
    {% if bank_accounts %}
    <table class="table">
        <thead>
            <th>Codigo</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
        </thead>
        <tbody>
            {% for bank_account in bank_accounts %}

            <tr>
                <td class="bank_account-id" data-id="{{bank_account.name}}"><span class="link_modal">{{bank_account.name}}</span></td>
                <td>{{bank_account.bank}}</td>
                <td>{{bank_account.account_type}}</td>
                <td>{{bank_account.bank_account_no}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="col-lg-12">
        <p>No hay cuentas bancarias registradas</p>
        {% endif %}
    </div>
</div>
