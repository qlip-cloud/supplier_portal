<form id="form-document" action="qp_supplier_front.resources.information.document.update">

    {% for document_setting in document_settings %}
    {% set line = document_setting.line %}
    {% set line_file = line and line.file %}
    <div class="row row-line">

        <div class="col-lg-4">
            <label for="document_setting">{{document_setting.title}}</label>

            <input type="text" autocomplete="off" name="value" data-document = {{document_setting.title}}
            class="input-with-feedback form-control floating-input bold" maxlength="140" data-fieldtype="Data"
            data-doctype="" id="value" value="{{line.value if line and line.value else ''}}" placeholder="{{document_setting.title}}">
        </div>

        <div class="col-lg-4">
            <label for="validity">Vigencia</label>

            <input type="text" autocomplete="off" name="validity" data-document = {{document_setting.title}}
            class="input-with-feedback form-control floating-input bold" maxlength="140" data-fieldtype="Date"
            data-doctype="" id="validity" value="{{line.validity if line and line.validity  else ''}}" placeholder="Vigencia de {{document_setting.title}}">

        </div>
        <div class="col-lg-4" style="align-content: end;">

            <label for="file">Archivo</label>
            {% if not line_file %}
            <div id="file_empty" style>
                <a id="link" class="btn btn-primary btn-sm primary-action" data-setting-id="{{document_setting.title}}">Subir archivo</a>
                <input type="file" class="supplier_file" data-document = "{{document_setting.title}}" id="file-{{document_setting.title}}" data-setting-id="{{document_setting.title}}"
                    style="display: none;">

                   
            </div>
            <div id="file_loading" style="display: none;">
                Cargando
            </div>
            {% endif %}
            <input type="hidden" class="" data-document = "{{document_setting.title}}" id="file1-{{document_setting.title}}" name="file" value="{{line.file if line else ''}}">

            <div id="file_full-{{document_setting.title}}" class="label-input" style="{{'display: none;' if not line_file else ''}}" >
                    <a href="{{line.file if line_file  else ''}}" class=" link"> {{line.file if line_file  else ''}}</a>
            </div>

        </div>
    </div>

    {% endfor %}

    <div class="row row-line">
        <div class="col-lg-4">
            <button class="btn btn-primary btn-sm primary-action" id="save">Guardar</button>
        </div>
    </div>

</form>
