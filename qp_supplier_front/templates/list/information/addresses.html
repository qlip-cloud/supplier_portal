<div class="row row-line">
    {% if addresses %}
    <table class="table">
        <thead>
            <th>Codigo</th>
            <th>País</th>
            <th>Departamento</th>
            <th>Municipio</th>
            <th>Dirección</th>
        </thead>
        <tbody>
            {% for address in addresses %}

            <tr>
                <td class="addres-id" data-id="{{address.name}}"><span class="link_modal">{{address.name}}</span>
                </td>
                <td>{{address.country}}</td>
                <td>{{address.city}}</td>
                <td>{{address.state}}</td>
                <th>{{address.address_line1}}</th>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="col-lg-12">
        <p>No hay direcciones registradas</p>
    </div>
    {% endif %}
</div>
