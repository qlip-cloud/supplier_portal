{% if receipts %}
    {% for payment in receipts %}
        <tr class="card-header" id="heading-{{ payment.qp_receipt_id }}">
            <td>{{payment.qp_receipt_id}}</td>
            <td class="text-left">{{frappe.format_date(payment.qp_create_date, "dd/MM/yyyy")}}</td>
            <td class="text-left">{{frappe.format_value(payment.qp_amount, "Currency")}}</td>
            <td class="text-left">
                <span class="material-symbols-outlined detail-row empty-data" id="action-{{payment.name}}"
                    data-toggle="collapse" data-target="#collapse-{{ payment.qp_receipt_id }}" aria-expanded="true"
                    aria-controls="collapse-{{ payment.qp_receipt_id }}" data-name="{{payment.name}}" data-key="{{key}}"
                    data-doctype="{{doctype_detail}}" data-parent-doctype="{{doctype}}" data-search="1">
                    inventory_2
                </span>
            </td>
        </tr>
        <tr id="collapse-{{ payment.qp_receipt_id }}" class="collapse" aria-labelledby="heading-{{ payment.qp_receipt_id }}"
            data-parent="#accordion" data-sync="0">
            <td colspan="4">
                
                Buscando información...
            </td>
        </tr>
    {% endfor %}
{% elif show_result %}
<tr>
    <td colspan="4">No hay resultados</td>
</tr>

{% endif %}
